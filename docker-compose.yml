
services:
  nextjs:
    image: ${DOCKERHUB_USERNAME}/nextjs-mongodb-app:${IMAGE_TAG:-latest}
    container_name: nextjs-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI must be configured}
    ports:
      - "127.0.0.1:3000:3000"
    init: true
    security_opt:
      - no-new-privileges:true
